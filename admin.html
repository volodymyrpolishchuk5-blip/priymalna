<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <!-- Секція 1: Аналітика та послуги -->
    <div id="admin-overview">
        <h2>Кабінет майстра</h2>
        <div class="stats-grid">
            <div class="stat-card dark">
                <span class="stat-label">Сьогодні</span>
                <div class="stat-value" id="stats-today">0 ₴</div>
            </div>
            <div class="stat-card">
                <span class="stat-label">Цей тиждень</span>
                <div class="stat-value" id="stats-week">0 ₴</div>
            </div>
            <div class="stat-card">
                <span class="stat-label">Цей місяць</span>
                <div class="stat-value" id="stats-month">0 ₴</div>
            </div>
            <div class="stat-card">
                <span class="stat-label">Всього записів</span>
                <div class="stat-value" id="stats-total">0</div>
            </div>
        </div>

        <h3>Керування послугами</h3>
        <div id="admin-services">
            <!-- Services will be loaded here dynamically -->
        </div>
        <button class="action-btn" onclick="addNewService()" style="background: #000; color: #fff; margin-top: 20px;">+ Додати послугу</button>
    </div>

    <!-- Секція 2: Список записів -->
    <div id="admin-bookings" style="display: none;">
        <h2>Список записів</h2>
        <div id="bookings-container" style="display: flex; flex-direction: column; gap: 10px;">
            <!-- Bookings will be loaded here dynamically -->
        </div>
    </div>
    
    <!-- Секція 3: Майстри -->
    <div id="admin-masters-tab" style="display: none;">
        <h2>Керування майстрами</h2>
        <div id="admin-masters">
            <!-- Masters will be loaded here dynamically -->
        </div>
        <button class="action-btn" onclick="addNewMaster()" style="background: #000; color: #fff; margin-top: 20px;">+ Додати майстра</button>
    </div>

    <!-- Секція 4: Клієнти -->
    <div id="admin-clients-tab" style="display: none;">
        <h2>База клієнтів</h2>
        <div id="admin-clients" style="display: flex; flex-direction: column; gap: 10px;">
            <!-- Clients will be loaded here dynamically -->
        </div>
    </div>

    <div class="nav-bar" style="grid-template-columns: repeat(4, 1fr);">
        <div class="nav-item active" onclick="switchAdminTab('overview')"><i>📈</i><br>Послуги</div>
        <div class="nav-item" onclick="switchAdminTab('bookings')"><i>📝</i><br>Записи</div>
        <div class="nav-item" onclick="switchAdminTab('masters')"><i>👥</i><br>Майстри</div>
        <div class="nav-item" onclick="switchAdminTab('clients')"><i>👑</i><br>Клієнти</div>
    </div>

    <!-- Модальне вікно (Послуги) -->
    <div id="service-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 id="modal-title">Послуга</h3>
            <input type="hidden" id="edit-old-name">
            <div class="input-group">
                <label>Назва послуги</label>
                <input type="text" id="modal-name" placeholder="Наприклад: Чоловіча стрижка">
            </div>
            <div class="input-group">
                <label>Ціна (грн)</label>
                <input type="number" id="modal-price" placeholder="500">
            </div>
            <div class="input-group">
                <label>Тривалість (хв)</label>
                <input type="number" id="modal-duration" value="60">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="action-btn" onclick="saveModalService()" style="background: #000; color: #fff;">Зберегти</button>
                <button class="action-btn" onclick="closeModal()" style="background: #f5f5f5; color: #333;">Скасувати</button>
            </div>
        </div>
    </div>

    <!-- Модальне вікно (Майстри) -->
    <div id="master-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 id="master-modal-title">Додати майстра</h3>
            <div class="input-group">
                <label>Ім'я майстра</label>
                <input type="text" id="master-name" placeholder="Анна">
            </div>
            <div class="input-group">
                <label>Спеціалізація</label>
                <input type="text" id="master-specialty" placeholder="Топ-майстер">
            </div>
            <div class="input-group">
                <label>Ник або Telegram ID (@username або 123...)</label>
                <input type="text" id="master-tg-id" placeholder="@username">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="action-btn" onclick="saveModalMaster()" style="background: #000; color: #fff;">Зберегти</button>
                <button class="action-btn" onclick="closeMasterModal()" style="background: #f5f5f5; color: #333;">Скасувати</button>
            </div>
        </div>
    </div>

    <style>
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
        }
        .modal-content {
            background: white; width: 90%; max-width: 400px;
            padding: 25px; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #777; margin-bottom: 5px; font-weight: 700; }
        .input-group input {
            width: 100%; padding: 12px; border: 1px solid #eee;
            border-radius: 10px; font-family: inherit; font-size: 14px;
        }
    </style>
</body>
</html>
