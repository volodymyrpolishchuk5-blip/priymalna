<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <div style="text-align: center; margin-bottom: 30px;">
        <div style="width: 80px; height: 80px; background: #eee; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 30px;">👤</div>
        <h2 id="user-name" style="margin: 0;">Ваш профіль</h2>
        <p style="color: var(--text-secondary); margin: 5px 0 0 0;">Клієнт №742</p>
    </div>

    <h3>Ваші записи</h3>
    <div id="user-bookings">
        <div class="summary-card" style="margin-top: 0; border: 1px solid var(--border-color);">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px;">
                <span class="price-tag">Активний</span>
                <span style="color: var(--text-secondary);">12 травня, 14:00</span>
            </div>
            <div class="booking-title">Манікюр</div>
            <div class="booking-master">Майстер: Анна</div>
            <button class="booking-cancel" onclick="cancelBooking('Ваш запис')">Скасувати запис</button>
        </div>
    </div>

    <button class="action-btn" onclick="contactAdmin()" style="margin-top: 30px; background: #000; color: #fff;">Зв'язатися з адміністратором</button>

    <div class="nav-bar">
        <div class="nav-item" onclick="location.href='index.html'"><i>🔘</i><br>Послуги</div>
        <div class="nav-item" onclick="location.href='masters.html'"><i>👥</i><br>Майстри</div>
        <div class="nav-item" onclick="location.href='calendar.html'"><i>📅</i><br>Запис</div>
        <div class="nav-item active" onclick="location.href='profile.html'"><i>👤</i><br>Профіль</div>
    </div>
</body>
</html>
